<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Controle de Estoque</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-box"></i>
                <h2>Estoque</h2>
            </div>

            <nav>
                <ul>

                    <li onclick="location.href='index.html'">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </li>

                    <li onclick="location.href='produtos.html'">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        Produtos
                    </li>

                    <li onclick="location.href='categorias.html'">
                        <i class="fa-solid fa-tags"></i>
                        Categorias
                    </li>

                    <li class="active">
                        <i class="fa-solid fa-file-lines"></i>
                        Relatórios
                    </li>

                </ul>
            </nav>

        </aside>

        <main class="content">

            <header>

                <h1>Relatórios</h1>

                <div class="user">

                    <i class="fa-solid fa-user"></i>

                    <span>Administrador</span>

                </div>

            </header>

            <section class="table-area relatorio-secao">

                <h2>Inventário Atual</h2>

                <table>

                    <thead>

                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço Unitário</th>
                            <th>Valor Total</th>
                            <th>Situação</th>
                        </tr>

                    </thead>

                    <tbody id="relatorioEstoque">

                    </tbody>

                </table>

            </section>

            <section class="table-area">

                <h2>Movimentações</h2>

                <table>

                    <thead>

                        <tr>
                            <th>Produto</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                            <th>Observação</th>
                            <th>Data</th>
                        </tr>

                    </thead>

                    <tbody id="relatorioMovimentacoes">

                    </tbody>

                </table>

            </section>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/relatorios.js"></script>

</body>

</html>
