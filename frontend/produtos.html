<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Controle de Estoque</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-box"></i>
                <h2>Estoque</h2>
            </div>

            <nav>
                <ul>

                    <li onclick="location.href='index.html'">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </li>

                    <li class="active">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        Produtos
                    </li>

                    <li onclick="location.href='categorias.html'">
                        <i class="fa-solid fa-tags"></i>
                        Categorias
                    </li>

                    <li onclick="location.href='relatorios.html'">
                        <i class="fa-solid fa-file-lines"></i>
                        Relatórios
                    </li>

                </ul>
            </nav>

        </aside>

        <main class="content">

            <header>

                <h1>Produtos</h1>
            
                <div class="actions">
            
                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Pesquisar produto..."
                    >
            
                    <button id="btnNovoProduto">
                        <i class="fa-solid fa-plus"></i>
                        Novo Produto
                    </button>
            
                </div>
            
            </header>

            <section class="table-area">

                <table>

                    <h2>Lista de Produtos</h2>
                    
                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="produtos">

                    </tbody>

                </table>

            </section>

        </main>

    </div>

    <!-- Modal -->
    <div id="modalProduto" class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Novo Produto</h2>

                <button id="fecharModal" class="btn-close">
                    &times;
                </button>

            </div>

            <div class="form-group">

                <label for="nomeProduto">Nome</label>

                <input
                    type="text"
                    id="nomeProduto"
                    placeholder="Digite o nome do produto">

            </div>

            <div class="form-group">

                <label for="categoriaProduto">Categoria</label>

                <select id="categoriaProduto">

                    <option>Carregando categorias...</option>

                </select>

            </div>

            <div class="form-group">

                <label for="precoProduto">Preço</label>

                <input
                    type="number"
                    step="0.01"
                    id="precoProduto">

            </div>

            <div class="form-group">

                <label for="quantidadeProduto">Quantidade</label>

                <input
                    type="number"
                    id="quantidadeProduto">

            </div>

            <div class="form-group">

                <label for="estoqueMinimo">Estoque mínimo</label>

                <input
                    type="number"
                    id="estoqueMinimo">

            </div>

            <div class="modal-buttons">

                <button id="cancelarProduto" class="btn-cancelar">
                    Cancelar
                </button>

                <button id="salvarProduto" class="btn-salvar">
                    Salvar Produto
                </button>

            </div>

        </div>

    </div>
    <div id="modalMovimentacao" class="modal hidden">

        <div class="modal-content">
    
            <div class="modal-header">
    
                <h2 id="tituloMovimentacao">Entrada de Estoque</h2>
    
                <button id="fecharMovimentacao" class="btn-close">
                    &times;
                </button>
    
            </div>
    
            <div class="form-group">
    
                <label for="quantidadeMovimentacao">Quantidade</label>
    
                <input
                    type="number"
                    id="quantidadeMovimentacao"
                    min="1"
                    placeholder="Digite a quantidade">
    
            </div>
    
            <div class="form-group">
    
                <label for="observacaoMovimentacao">Observação</label>
    
                <input
                    type="text"
                    id="observacaoMovimentacao"
                    placeholder="Ex.: Compra de fornecedor">
    
            </div>
    
            <div class="modal-buttons">
    
                <button
                    id="cancelarMovimentacao"
                    class="btn-cancelar">
    
                    Cancelar
    
                </button>
    
                <button
                    id="confirmarMovimentacao"
                    class="btn-salvar">
    
                    Confirmar
    
                </button>
    
            </div>
    
        </div>
    
    </div>

    <div id="modalHistorico" class="modal hidden">

        <div class="modal-content modal-grande">

            <div class="modal-header">

                <h2>Histórico de Movimentações</h2>

                <button id="fecharHistorico" class="btn-close">
                    &times;
                </button>

            </div>

            <table>

                <thead>

                    <tr>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Observação</th>
                        <th>Data</th>
                    </tr>

                </thead>

                <tbody id="historicoProduto">

                </tbody>

            </table>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/produtos.js"></script>
    <script src="js/estoque.js"></script>

</body>

</html>
