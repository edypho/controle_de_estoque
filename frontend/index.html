<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-box"></i>
                <h2>Estoque</h2>
            </div>

            <nav>

                <ul>

                    <li class="active">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </li>

                    <li onclick="location.href='produtos.html'">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        Produtos
                    </li>

                    <li>
                        <i class="fa-solid fa-arrow-down"></i>
                        Entradas
                    </li>

                    <li>
                        <i class="fa-solid fa-arrow-up"></i>
                        Saídas
                    </li>

                    <li>
                        <i class="fa-solid fa-file-lines"></i>
                        Relatórios
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- Conteúdo -->
        <main class="content">

            <header>

                <h1>Dashboard</h1>

                <div class="user">

                    <i class="fa-solid fa-user"></i>

                    <span>Administrador</span>

                </div>

            </header>

            <section class="cards">

                <div class="card">
                    <h3>Total de Produtos</h3>
                    <h2 id="totalProdutos">0</h2>
                </div>
                
                <div class="card">
                    <h3>Entradas</h3>
                    <h2 id="totalEntradas">0</h2>
                </div>
                
                <div class="card">
                    <h3>Saídas</h3>
                    <h2 id="totalSaidas">0</h2>
                </div>
                
                <div class="card">
                    <h3>Estoque Baixo</h3>
                    <h2 id="estoqueBaixo">0</h2>
                </div>

            </section>

            <section class="table-area">

                <h2>Produtos</h2>

                <table>

                    <thead>

                        <tr>

                            <th>Produto</th>

                            <th>Categoria</th>

                            <th>Quantidade</th>

                            <th>Preço</th>

                        </tr>

                    </thead>

                    <tbody id="produtos">

                    </tbody>

                </table>

            </section>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
